name: Web CI/CD

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/contracts/**"
      - "packages/geo/**"
      - "specs/001-shared-api-contract/contracts/openapi.yaml"
      - "package*.json"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run contracts:generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_USE_MOCK_API: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  deploy:
    name: Deploy production to Vercel
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [quality, e2e]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: web-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate production secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name in the GitHub production environment"
              exit 1
            fi
          done
      - name: Pull Vercel production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@65.16.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build Vercel artifacts
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@65.16.0 build --prod --token="$VERCEL_TOKEN"
      - name: Deploy immutable artifacts
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url="$(npx --yes vercel@65.16.0 deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
      - name: Smoke test public web app
        if: ${{ vars.WEB_SMOKE_URL != '' }}
        env:
          WEB_SMOKE_URL: ${{ vars.WEB_SMOKE_URL }}
        run: curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 "$WEB_SMOKE_URL" > /dev/null
